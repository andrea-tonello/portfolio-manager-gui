# Publishes assets/docs/ (the privacy policy) to GitHub Pages, e.g.
# https://andrea-tonello.github.io/portfolio-manager-gui/privacy_policy
# Pages can only publish a branch's root or /docs folder by itself, so this
# workflow builds the site from assets/docs/ instead. Requires the repository's
# Settings > Pages > Source to be "GitHub Actions".
# Manual only: run it from the Actions tab after changing assets/docs/.
# Based on GitHub's starter workflow pages/jekyll-gh-pages.yml.
name: Deploy docs to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Same Jekyll build the branch-based Pages used, so privacy_policy.md
      # still becomes /privacy_policy.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./assets/docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
