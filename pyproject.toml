[project]
name = "portfolio-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    # Exact pins: `flet build` installs these ranges itself (it ignores uv.lock),
    # so pinning keeps the phone app on the same versions the tests run.
    # flet-charts must match the flet version exactly. See REFACTORING.md Q4.
    # numpy/pandas: the newest builds Flet's mobile package index offers for Android.
    "flet==1.0.3",
    "flet-charts==1.0.3",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "python-dateutil>=2.8.2",
]

[tool.flet.app]
# Left out of the app package. Each entry is an exact path, compared as text:
# wildcards don't work here (put those in [tool.flet.cleanup] app_files), and
# Windows builds compare with backslashes, so nested paths are listed twice.
exclude = [
    "tests",
    ".git",
    "__pycache__",
    ".venv",
    "assets/docs", 'assets\docs',      # the GitHub Pages site, not used by the app
    "assets/readme", 'assets\readme',  # README screenshots
]

[tool.flet.compile]
app = true
packages = true

[tool.flet.cleanup]
app = true
packages = true
# Deleted from the packaged app; these are wildcard patterns, matched on every platform.
app_files = [
    "**/__pycache__",
    "**/*.md",
    "**/*.rst",
    "**/*.csv",       # e.g. a report exported into the project folder
    "assets/*-old*",  # old versions of images kept while replacing them
]
package_files = [
    "**/*.pyi",
    "**/*.typed",
    "**/__pycache__",
    "**/*.md",
    "**/*.rst",
    "**/*.txt",
    "**/*.html",
    "**/tests",
    "**/test",
    "**/*.c",
    "**/*.h",
    "**/*.hpp",
]

[tool.flet.flutter.pubspec.dependency_overrides]
connectivity_plus = "7.0.0"
# Flet 1.0.3's build template pins jni 1.0.0, but jni_flutter 1.0.4 (released
# 2026-10-01) only works with jni >= 1.1, which breaks Android builds. 1.0.3 is the
# version Flet 1.0.3 shipped with. Remove when moving to a Flet version that fixes it.
jni_flutter = "1.0.3"

[tool.flet.android]
target_arch = ["arm64-v8a"]

[tool.flet.android.permission]
"android.permission.VIBRATE" = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Any Flet deprecation warning fails the tests (see REFACTORING.md, Q4).
filterwarnings = ["error:.*is deprecated since version:DeprecationWarning"]
